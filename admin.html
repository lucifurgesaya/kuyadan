<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Kuya Dan CMS Dashboard</title>

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#f7f5f1;
      overflow-x:hidden;
    }

    .card{
      background:white;
      border-radius:32px;
      padding:32px;
      box-shadow:0 10px 40px rgba(0,0,0,0.05);
    }

    textarea{
      resize:none;
    }

    iframe{
      border:none;
    }

    .glass{
      backdrop-filter:blur(20px);
      background:rgba(255,255,255,0.7);
    }

  </style>

</head>

<body class="min-h-screen text-zinc-900">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 border-b border-zinc-200 glass">

    <div class="max-w-[1600px] mx-auto px-6 py-5 flex justify-between items-center">

      <div>

        <h1 class="text-3xl font-black">
          Kuya Dan CMS
        </h1>

        <p class="text-zinc-500 text-sm">
          Ministry Website Admin Dashboard
        </p>

      </div>

      <div class="flex gap-4">

        <button
          onclick="refreshPreview()"
          class="bg-black text-white px-6 py-3 rounded-2xl hover:scale-105 transition"
        >
          Refresh Preview
        </button>

      </div>

    </div>

  </nav>

  <!-- MAIN -->
  <main class="max-w-[1600px] mx-auto px-6 py-10">

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">

      <!-- LEFT SIDE -->
      <div class="space-y-10">

        <!-- HERO SETTINGS -->
        <section class="card">

          <div class="mb-8">

            <h2 class="text-4xl font-black">
              Hero Section
            </h2>

            <p class="text-zinc-500 mt-2">
              Edit homepage hero contents.
            </p>

          </div>

          <div class="space-y-6">

            <div>

              <label class="font-semibold">
                Hero Title
              </label>

              <input
                id="heroTitle"
                type="text"
                class="w-full mt-2 border border-zinc-300 rounded-2xl p-4"
                placeholder="Kuya Dan"
              />

            </div>

            <div>

              <label class="font-semibold">
                Hero Description
              </label>

              <textarea
                id="heroDescription"
                rows="6"
                class="w-full mt-2 border border-zinc-300 rounded-2xl p-4"
                placeholder="Write hero description..."
              ></textarea>

            </div>

            <button
              onclick="updateHeroSection()"
              class="bg-black text-white px-8 py-4 rounded-2xl hover:scale-105 transition"
            >
              Save Hero Section
            </button>

          </div>

        </section>

        <!-- CREATE STORY -->
        <section class="card">

          <div class="mb-8">

            <h2 class="text-4xl font-black">
              Create Story
            </h2>

            <p class="text-zinc-500 mt-2">
              Add sermons, devotionals, testimonies, reflections, and blogs.
            </p>

          </div>

          <div class="space-y-6">

            <div>

              <label class="font-semibold">
                Story Title
              </label>

              <input
                id="storyTitle"
                type="text"
                class="w-full mt-2 border border-zinc-300 rounded-2xl p-4"
                placeholder="Faith Through The Storm"
              />

            </div>

            <div>

              <label class="font-semibold">
                Bible Verse
              </label>

              <input
                id="storyVerse"
                type="text"
                class="w-full mt-2 border border-zinc-300 rounded-2xl p-4"
                placeholder="Mark 4:39"
              />

            </div>

            <div>

              <label class="font-semibold">
                Story Content
              </label>

              <textarea
                id="storyContent"
                rows="12"
                class="w-full mt-2 border border-zinc-300 rounded-2xl p-4"
                placeholder="Write your story here..."
              ></textarea>

            </div>

            <button
              onclick="createStory()"
              class="bg-black text-white px-8 py-4 rounded-2xl hover:scale-105 transition"
            >
              Publish Story
            </button>

          </div>

        </section>

        <!-- STORIES LIST -->
        <section class="card">

          <div class="mb-8">

            <h2 class="text-4xl font-black">
              Published Stories
            </h2>

            <p class="text-zinc-500 mt-2">
              Manage all website stories and sermons.
            </p>

          </div>

          <div
            id="storiesList"
            class="grid grid-cols-1 gap-6"
          >
          </div>

        </section>

      </div>

      <!-- RIGHT SIDE -->
      <div class="sticky top-28 h-[90vh]">

        <div class="bg-white rounded-[2rem] border border-zinc-200 shadow-2xl overflow-hidden h-full">

          <div class="flex items-center justify-between px-6 py-5 border-b border-zinc-200">

            <div>

              <h2 class="text-2xl font-black">
                Live Website Preview
              </h2>

              <p class="text-zinc-500 text-sm">
                Real-time frontend preview
              </p>

            </div>

            <button
              onclick="refreshPreview()"
              class="bg-black text-white px-5 py-3 rounded-2xl"
            >
              Refresh
            </button>

          </div>

          <iframe
            id="previewFrame"
            src="index.html"
            class="w-full h-full bg-white"
          ></iframe>

        </div>

      </div>

    </div>

  </main>

  <!-- SUPABASE -->
  <script>

    const SUPABASE_URL =
    "https://qvcipcwgzjttqvffdeye.supabase.co";

    const SUPABASE_ANON_KEY =
    "YOUR_PUBLISHABLE_KEY";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  </script>

  <!-- ADMIN JS -->
  <script>

    // REFRESH LIVE PREVIEW
    function refreshPreview() {

      const frame =
        document.getElementById('previewFrame');

      frame.src = frame.src;
    }

    // LOAD WEBSITE SETTINGS
    async function loadWebsiteSettings() {

      const { data, error } =
        await supabaseClient
          .from('website_settings')
          .select('*')
          .single();

      if(error){
        console.error(error);
        return;
      }

      document.getElementById('heroTitle').value =
        data.hero_title;

      document.getElementById('heroDescription').value =
        data.hero_description;
    }

    // UPDATE HERO
    async function updateHeroSection() {

      const heroTitle =
        document.getElementById('heroTitle').value;

      const heroDescription =
        document.getElementById('heroDescription').value;

      const { error } =
        await supabaseClient
          .from('website_settings')
          .update({
            hero_title: heroTitle,
            hero_description: heroDescription
          })
          .eq('id', 1);

      if(error){
        console.error(error);
        alert('Update Failed');
        return;
      }

      alert('Hero Section Updated!');

      refreshPreview();
    }

    // LOAD STORIES
    async function loadStories() {

      const { data, error } =
        await supabaseClient
          .from('stories')
          .select('*')
          .order('created_at', {
            ascending:false
          });

      if(error){
        console.error(error);
        return;
      }

      const storiesList =
        document.getElementById('storiesList');

      storiesList.innerHTML = '';

      data.forEach((story) => {

        storiesList.innerHTML += `
          <div class="border border-zinc-200 rounded-[2rem] p-6">

            <h3 class="text-3xl font-black">
              ${story.title}
            </h3>

            <p class="text-zinc-500 mt-2">
              ${story.verse}
            </p>

            <p class="mt-6 text-zinc-700 leading-relaxed">
              ${story.content}
            </p>

            <div class="flex gap-4 mt-8">

              <button
                onclick="deleteStory(${story.id})"
                class="bg-red-500 text-white px-5 py-3 rounded-2xl"
              >
                Delete
              </button>

            </div>

          </div>
        `;
      });

    }

    // CREATE STORY
    async function createStory() {

      const title =
        document.getElementById('storyTitle').value;

      const verse =
        document.getElementById('storyVerse').value;

      const content =
        document.getElementById('storyContent').value;

      const slug =
        title.toLowerCase().replaceAll(' ', '-');

      const { error } =
        await supabaseClient
          .from('stories')
          .insert([
            {
              title,
              verse,
              content,
              slug
            }
          ]);

      if(error){
        console.error(error);
        alert('Failed Creating Story');
        return;
      }

      alert('Story Published Successfully!');

      document.getElementById('storyTitle').value = '';
      document.getElementById('storyVerse').value = '';
      document.getElementById('storyContent').value = '';

      loadStories();

      refreshPreview();
    }

    // DELETE STORY
    async function deleteStory(id) {

      const { error } =
        await supabaseClient
          .from('stories')
          .delete()
          .eq('id', id);

      if(error){
        console.error(error);
        return;
      }

      loadStories();

      refreshPreview();
    }

    // INITIALIZE
    loadWebsiteSettings();
    loadStories();

  </script>

</body>
</html>
